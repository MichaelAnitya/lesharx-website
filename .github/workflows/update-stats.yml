name: Update collection stats

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch Magic Eden stats
        run: |
          resp=$(curl -sf --max-time 30 "https://api-mainnet.magiceden.dev/v2/collections/lesharx_/stats") || { echo "API unavailable, keeping existing stats"; exit 0; }
          listed=$(echo "$resp" | jq -r '.listedCount // empty')
          floor=$(echo "$resp" | jq -r '.floorPrice // empty')
          if [ -z "$listed" ]; then echo "No listedCount in response, keeping existing stats"; exit 0; fi
          jq -n --argjson listed "$listed" --argjson floor "${floor:-0}" --arg updated "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{listedCount: $listed, floorPriceLamports: $floor, updated: $updated}' > assets/stats.json
          cat assets/stats.json

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/stats.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: refresh Magic Eden stats"
            git push
          else
            echo "Stats unchanged"
          fi
